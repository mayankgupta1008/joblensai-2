# Production (AWS EKS) values
# Usage: ArgoCD will use this via valueFiles in the Application spec

replicaCount: 2

image:
  repository: 224976804927.dkr.ecr.ap-south-1.amazonaws.com/joblensai-notification
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "notification"

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "5005"
  prometheus.io/path: "/api/notification/metrics"

podLabels:
  app.kubernetes.io/part-of: joblensai

podSecurityContext: {}
securityContext: {}

containerPort: 5005

service:
  type: ClusterIP
  port: 5005

livenessProbe:
  httpGet:
    path: /api/notification/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/notification/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

env:
  NODE_ENV: production
  PORT: "5005"
  SERVICE_NAME: notification
  LOG_LEVEL: info

# Secrets from External Secrets Operator (synced from AWS Secrets Manager)
envFrom:
  - secretRef:
      name: joblensai-secrets

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []

# Spread pods across nodes for HA
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: joblensai-notification
          topologyKey: kubernetes.io/hostname
