# Local Kind cluster values
# Usage: helm install backend . -f values-local.yaml -n joblensai

replicaCount: 1

image:
  repository: backend
  pullPolicy: Never  # Matches: docker build -t backend:local . (from deploy-local.sh)
  tag: "local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "backend"

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "5001"
  prometheus.io/path: "/api/backend/metrics"

podLabels:
  app.kubernetes.io/part-of: joblensai

podSecurityContext: {}
securityContext: {}

containerPort: 5001

service:
  type: ClusterIP
  port: 5001

livenessProbe:
  httpGet:
    path: /api/backend/health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/backend/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

env:
  NODE_ENV: development
  PORT: "5001"
  SERVICE_NAME: backend
  LOG_LEVEL: debug

envFrom:
  - secretRef:
      name: joblensai-secrets

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

autoscaling:
  enabled: false

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
