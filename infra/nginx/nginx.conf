events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Rate limiting: 5 requests/sec per IP for auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Cache for auth validation responses
    proxy_cache_path /tmp/auth_cache levels=1:2 keys_zone=auth_cache:10m max_size=100m inactive=5m;

    # Trust X-Forwarded-Proto from upstream load balancer (Render, Vercel, etc.)
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream frontend {
        server web:5173;
    }

    upstream auth {
        server auth:5003;
    }

    upstream backend {
        server backend:5001;
    }

    upstream agent_service {
        server agent-service:5002;
    }

    upstream payment_service {
        server payment-service:5004;
    }
    
    upstream prometheus {
        server prometheus:9090;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream mongo_express {
        server mongo-express:8081;
    }

    upstream notification_service {
        server notification-service:5005;
    }

    upstream kafka_ui {
        server kafka-ui:8080;
    }

    server {
        listen 80;

        # ─────────────────────────────────────────────────────────────
        # Internal auth validation endpoint
        # ─────────────────────────────────────────────────────────────
        location = /_validate_token {
            internal;
            proxy_pass http://auth/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;

            # Cache auth responses to reduce load on auth service
            proxy_cache auth_cache;
            proxy_cache_key $http_authorization$http_cookie;
            proxy_cache_valid 200 5m;
            proxy_cache_valid 401 403 1m;
        }

        # ─────────────────────────────────────────────────────────────
        # Frontend
        # ─────────────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # ─────────────────────────────────────────────────────────────
        # Auth Service - Public routes (no auth required)
        # ─────────────────────────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
        }

        # ─────────────────────────────────────────────────────────────
        # Health Checks - No auth required
        # ─────────────────────────────────────────────────────────────
        location = /api/backend/health {
            proxy_pass http://backend/api/backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        location = /api/payment/health {
            proxy_pass http://payment_service/api/payment/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        location = /api/agent-service/health {
            proxy_pass http://agent_service/api/agent-service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        location = /api/notification/health {
            proxy_pass http://notification_service/api/notification/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # ─────────────────────────────────────────────────────────────
        # Backend Service - Protected
        # ─────────────────────────────────────────────────────────────
        location ~ ^/api/(account|file) {
            auth_request /_validate_token;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role; 
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header Authorization "";
        }

        # ─────────────────────────────────────────────────────────────
        # Payment Service - Webhook (Public)
        # ─────────────────────────────────────────────────────────────
        location = /api/payment/webhook {
            proxy_pass http://payment_service/api/payment/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # ─────────────────────────────────────────────────────────────
        # Payment Service - Protected
        # ─────────────────────────────────────────────────────────────
        location /api/payment/ {
            auth_request /_validate_token;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            proxy_pass http://payment_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header Authorization "";
            proxy_set_header X-Idempotency-Key $http_x_idempotency_key;
        }

        # ─────────────────────────────────────────────────────────────
        # Agent Service - Protected
        # ─────────────────────────────────────────────────────────────
        location /api/agent/ {
            auth_request /_validate_token;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            proxy_pass http://agent_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header Authorization "";
        }

        # ─────────────────────────────────────────────────────────────
        # Monitoring - Prometheus & Grafana
        # ─────────────────────────────────────────────────────────────
        location /prometheus/ {
            proxy_pass http://prometheus/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }
        
        location /grafana/ {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # ─────────────────────────────────────────────────────────────
        # Mongo Express - Admin Tool
        # ─────────────────────────────────────────────────────────────
        location /mongo-express/ {
            proxy_pass http://mongo_express;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # ─────────────────────────────────────────────────────────────
        # Kafka UI - Admin Tool
        # ─────────────────────────────────────────────────────────────
        location /kafka-ui/ {
            proxy_pass http://kafka_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
