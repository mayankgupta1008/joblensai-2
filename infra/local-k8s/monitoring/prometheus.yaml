apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: joblensai
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "backend"
        scrape_interval: 15s
        metrics_path: "/api/backend/metrics"
        static_configs:
          - targets: ["backend.joblensai.svc.cluster.local:5001"]

      - job_name: "auth"
        scrape_interval: 15s
        metrics_path: "/api/auth/metrics"
        static_configs:
          - targets: ["auth.joblensai.svc.cluster.local:5003"]

      - job_name: "agent-service"
        scrape_interval: 15s
        metrics_path: "/api/agent-service/metrics"
        static_configs:
          - targets: ["agent-service.joblensai.svc.cluster.local:5002"]

      - job_name: "payment-service"
        scrape_interval: 15s
        metrics_path: "/api/payment/metrics"
        static_configs:
          - targets: ["payment.joblensai.svc.cluster.local:5004"]

      - job_name: "notification-service"
        scrape_interval: 15s
        metrics_path: "/api/notification/metrics"
        static_configs:
          - targets: ["notification.joblensai.svc.cluster.local:5005"]

      - job_name: "node-exporter"
        scrape_interval: 15s
        dns_sd_configs:
          - names: ["node-exporter.joblensai.svc.cluster.local"]
            type: A
            port: 9100

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: joblensai
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.external-url=/prometheus/"
            - "--web.route-prefix=/prometheus/"
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /prometheus/-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /prometheus/-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: joblensai
  labels:
    app: prometheus
spec:
  ports:
    - port: 9090
      targetPort: 9090
  selector:
    app: prometheus
