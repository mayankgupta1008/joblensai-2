# ============================================================
# HashiCorp Vault — Prod Mode (raft storage, auto-unseal via local-kms)
# Initialized once by deploy-local.sh (root token + recovery key → macOS Keychain)
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: joblensai
  labels:
    app: vault
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      containers:
        - name: vault
          image: hashicorp/vault:2.0.4
          args:
            - "server"
          ports:
            - containerPort: 8200
              name: http
          env:
            # Seal = AWS KMS API served by local-kms; real AWS KMS: drop endpoint/access_key/secret_key, set the key ARN
            - name: VAULT_LOCAL_CONFIG
              value: >-
                {"disable_mlock": true, "storage": {"raft": {"path": "/vault/file"}},
                "listener": [{"tcp": {"address": "0.0.0.0:8200", "tls_disable": true}}],
                "seal": {"awskms": {"endpoint": "http://local-kms:8080", "kms_key_id": "alias/vault-unseal",
                "region": "eu-west-2", "access_key": "local", "secret_key": "local"}},
                "api_addr": "http://127.0.0.1:8200", "cluster_addr": "http://127.0.0.1:8201"}
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          volumeMounts:
            - name: vault-data
              mountPath: /vault/file
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: vault-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: joblensai
  labels:
    app: vault
spec:
  ports:
    - port: 8200
      targetPort: 8200
      name: http
  selector:
    app: vault
  clusterIP: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: joblensai
---
# Lets Vault verify ESO's ServiceAccount token (Kubernetes auth) via the TokenReview API
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: joblensai
