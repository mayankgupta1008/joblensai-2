# ============================================================
# Gitea — Lightweight Git Server for Local GitOps
# Provides GitHub-like experience for ArgoCD in Kind cluster
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitea
  namespace: joblensai
  labels:
    app: gitea
spec:
  serviceName: gitea
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: gitea/gitea:1.21-rootless
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 2222
              name: ssh
          env:
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__server__ROOT_URL
              value: http://gitea:3000
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "false"
            - name: GITEA__webhook__ALLOWED_HOST_LIST
              value: "*"
          volumeMounts:
            - name: gitea-data
              mountPath: /var/lib/gitea
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: gitea-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: joblensai
  labels:
    app: gitea
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
    - port: 2222
      targetPort: 2222
      name: ssh
  selector:
    app: gitea
