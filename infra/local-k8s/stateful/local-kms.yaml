apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-kms
  namespace: joblensai
spec:
  selector:
    matchLabels:
      app: local-kms
  template:
    metadata:
      labels:
        app: local-kms
    spec:
      containers:
        - name: local-kms
          image: nsmithuk/local-kms:3.11.7
          volumeMounts:
            - name: seed
              mountPath: /init
      volumes:
        - name: seed
          secret:
            secretName: local-kms-seed # created by deploy-local.sh, never in git
---
apiVersion: v1
kind: Service
metadata:
  name: local-kms
  namespace: joblensai
spec:
  ports:
    - port: 8080
  selector:
    app: local-kms
