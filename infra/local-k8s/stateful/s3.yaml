apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3
  namespace: joblensai
  labels:
    app: s3
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      containers:
        - name: s3
          image: rustfs/rustfs:1.0.1
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: s3-console
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: joblensai-secrets
                  key: S3_ROOT_USER
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joblensai-secrets
                  key: S3_ROOT_PASSWORD
          volumeMounts:
            - name: s3-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: s3-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: joblensai
  labels:
    app: s3
spec:
  ports:
    - port: 9000
      targetPort: 9000
      name: s3
    - port: 9001
      targetPort: 9001
      name: s3-console
  selector:
    app: s3
  clusterIP: None
