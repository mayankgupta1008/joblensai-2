# ============================================================
# ClusterSecretStore — Local Vault Backend
# ESO uses this to know WHERE to fetch secrets from
# ============================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.joblensai.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: joblensai
---
# Vault root token for ESO to authenticate
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: joblensai
type: Opaque
stringData:
  token: "root"  # Dev mode root token
