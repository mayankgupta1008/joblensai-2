# ============================================================
# ExternalSecrets — Syncs secrets from Vault → K8s Secrets
# THIS FILE IS ENVIRONMENT-AGNOSTIC (same for local & prod)
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: joblensai-secrets
  namespace: joblensai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: joblensai-secrets  # Creates K8s Secret with this name
    creationPolicy: Owner
  data:
    # ─────────────────────────────────────────────────────────────
    # Infrastructure
    # ─────────────────────────────────────────────────────────────
    # MongoDB
    - secretKey: MONGO_INITDB_ROOT_USERNAME
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: MONGO_INITDB_ROOT_USERNAME
    - secretKey: MONGO_INITDB_ROOT_PASSWORD
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: MONGO_INITDB_ROOT_PASSWORD
    - secretKey: MONGODB_URI
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: MONGODB_URI

    # Redis
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: REDIS_URL
    - secretKey: REDIS_HOST
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: REDIS_HOST
    - secretKey: REDIS_PORT
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: REDIS_PORT

    # Minio (S3-compatible)
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: MINIO_ROOT_USER
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: MINIO_ROOT_PASSWORD
    - secretKey: MINIO_ENDPOINT
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: MINIO_ENDPOINT
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: S3_BUCKET
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: S3_BUCKET

    # Kafka
    - secretKey: KAFKA_BROKERS
      remoteRef:
        key: secret/data/joblensai/infrastructure
        property: KAFKA_BROKERS

    # ─────────────────────────────────────────────────────────────
    # Auth Service
    # ─────────────────────────────────────────────────────────────
    - secretKey: JWT_PRIVATE_KEY_BASE64
      remoteRef:
        key: secret/data/joblensai/auth
        property: JWT_PRIVATE_KEY_BASE64
    - secretKey: JWT_PUBLIC_KEY_BASE64
      remoteRef:
        key: secret/data/joblensai/auth
        property: JWT_PUBLIC_KEY_BASE64
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: secret/data/joblensai/auth
        property: GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: secret/data/joblensai/auth
        property: GOOGLE_CLIENT_SECRET

    # ─────────────────────────────────────────────────────────────
    # Payment Service
    # ─────────────────────────────────────────────────────────────
    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: secret/data/joblensai/payment
        property: RAZORPAY_KEY_ID
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: secret/data/joblensai/payment
        property: RAZORPAY_KEY_SECRET
    - secretKey: RAZORPAY_WEBHOOK_SECRET
      remoteRef:
        key: secret/data/joblensai/payment
        property: RAZORPAY_WEBHOOK_SECRET

    # ─────────────────────────────────────────────────────────────
    # Agent Service (AI)
    # ─────────────────────────────────────────────────────────────
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: secret/data/joblensai/agent
        property: OPENAI_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: secret/data/joblensai/agent
        property: ANTHROPIC_API_KEY

    # ─────────────────────────────────────────────────────────────
    # Notification Service
    # ─────────────────────────────────────────────────────────────
    - secretKey: EMAIL_SERVICE
      remoteRef:
        key: secret/data/joblensai/notification
        property: EMAIL_SERVICE
    - secretKey: EMAIL_USERNAME
      remoteRef:
        key: secret/data/joblensai/notification
        property: EMAIL_USERNAME
    - secretKey: EMAIL_PASSWORD
      remoteRef:
        key: secret/data/joblensai/notification
        property: EMAIL_PASSWORD
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: secret/data/joblensai/notification
        property: RESEND_API_KEY
