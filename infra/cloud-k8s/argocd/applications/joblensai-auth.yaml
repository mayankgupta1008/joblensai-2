apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: joblensai-auth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: joblensai
  source:
    repoURL: https://github.com/mayankgupta1008/joblensai-2
    targetRevision: main
    path: apps/auth/chart
    helm:
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: joblensai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
