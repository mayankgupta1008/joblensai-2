name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 224976804927.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_PREFIX: joblensai

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build shared package
        run: pnpm --filter @joblensai/shared build

      - name: Build all services
        run: |
          pnpm --filter auth build
          pnpm --filter backend build
          pnpm --filter payment build
          pnpm --filter notification build
          pnpm --filter agent-service build
          pnpm --filter web build

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint-and-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run --passWithNoTests

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/nodejs \
            --config p/typescript \
            --config p/jwt \
            --config p/secrets \
            apps/ packages/

  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          cache: true
          version: v0.69.3

      - name: Run Trivy vulnerability scanner
        run: trivy fs --severity CRITICAL,HIGH .

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: [lint-and-build]

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth
            dockerfile: apps/auth/Dockerfile.prod
          - name: backend
            dockerfile: apps/backend/Dockerfile.prod
          - name: payment
            dockerfile: apps/payment/Dockerfile.prod
          - name: notification
            dockerfile: apps/notification/Dockerfile.prod
          - name: agent-service
            dockerfile: apps/agent-service/Dockerfile.prod
          - name: web
            dockerfile: apps/web/Dockerfile.prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          cache: true
          version: v0.69.3

      - name: Build Docker image
        run: docker build -f ${{ matrix.service.dockerfile }} -t joblensai/${{ matrix.service.name }}:scan .

      - name: Run Trivy container scan
        run: trivy image --severity CRITICAL,HIGH joblensai/${{ matrix.service.name }}:scan

  push-images:
    name: Push Images to ECR
    runs-on: ubuntu-latest
    needs: [test, container-scan, sast, sca]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth
            dockerfile: apps/auth/Dockerfile.prod
          - name: backend
            dockerfile: apps/backend/Dockerfile.prod
          - name: payment
            dockerfile: apps/payment/Dockerfile.prod
          - name: notification
            dockerfile: apps/notification/Dockerfile.prod
          - name: agent-service
            dockerfile: apps/agent-service/Dockerfile.prod
          - name: web
            dockerfile: apps/web/Dockerfile.prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224976804927:role/joblensai-aws-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------
  # LOCAL K8S DEPLOY (ArgoCD) — keep if: false, do NOT delete.
  # This job is used for local KinD + ArgoCD deployments.
  # Switch if: false → if: <condition> to re-enable for local K8s.
  # ---------------------------------------------------------------
  deploy-k8s:
    name: Deploy to K8s (ArgoCD)
    runs-on: ubuntu-latest
    needs: [push-images]
    if: false # Kept for local KinD + ArgoCD — disabled in prod

    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      - name: Login to ArgoCD
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --grpc-web \
            --insecure

      - name: Update image tags for all services
        run: |
          SERVICES="auth backend payment notification agent-service web"
          for service in $SERVICES; do
            echo "Updating $service to image tag ${{ github.sha }}..."
            argocd app set $service \
              --helm-set image.tag=${{ github.sha }} \
              --grpc-web
          done

      - name: Sync all applications
        run: |
          SERVICES="auth backend payment notification agent-service web"
          for service in $SERVICES; do
            echo "Syncing $service..."
            argocd app sync $service --grpc-web --async
          done

      - name: Wait for deployments to be healthy
        run: |
          SERVICES="auth backend payment notification agent-service web"
          for service in $SERVICES; do
            echo "Waiting for $service to be healthy..."
            argocd app wait $service \
              --health \
              --timeout 300 \
              --grpc-web || echo "Warning: $service health check timed out"
          done

  # ---------------------------------------------------------------
  # AWS ECS DEPLOY — active prod deployment
  # Triggers a rolling deploy on ECS for all app services.
  # Uses force-new-deployment → ECS pulls :latest from ECR and
  # replaces running tasks one by one (zero downtime).
  #
  # NOTE: The IAM role joblensai-aws-ecr must also have these
  # ECS permissions added in AWS Console / IAM:
  #   - ecs:UpdateService
  #   - ecs:DescribeServices
  # ---------------------------------------------------------------
  deploy-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [push-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224976804927:role/joblensai-aws-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment for all services
        run: |
          SERVICES="auth backend payment notification agent-service web"
          for service in $SERVICES; do
            echo "Deploying $service to ECS..."
            aws ecs update-service \
              --cluster joblensai-prod \
              --service joblensai-prod-$service \
              --force-new-deployment \
              --region ${{ env.AWS_REGION }}
            echo "$service deployment triggered ✓"
          done

      - name: Wait for all services to stabilize
        run: |
          SERVICES="auth backend payment notification agent-service web"
          for service in $SERVICES; do
            echo "Waiting for $service to stabilize..."
            aws ecs wait services-stable \
              --cluster joblensai-prod \
              --services joblensai-prod-$service \
              --region ${{ env.AWS_REGION }} \
            || echo "Warning: $service did not stabilize within timeout"
          done
