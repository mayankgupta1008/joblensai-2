name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build shared package
        run: pnpm --filter @joblensai/shared build

      - name: Build all services
        run: |
          pnpm --filter auth build
          pnpm --filter backend build
          pnpm --filter payment build
          pnpm --filter notification build
          pnpm --filter agent-service build
          pnpm --filter web build

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint-and-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run --passWithNoTests

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/nodejs \
            --config p/typescript \
            --config p/jwt \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            apps/ packages/ || true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif

  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          cache: true

      - name: Run Trivy vulnerability scanner
        run: trivy fs --severity CRITICAL,HIGH --format sarif --output trivy-results.sarif .

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: [lint-and-build]

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth
            dockerfile: apps/auth/Dockerfile.prod
          - name: backend
            dockerfile: apps/backend/Dockerfile.prod
          - name: payment
            dockerfile: apps/payment/Dockerfile.prod
          - name: notification
            dockerfile: apps/notification/Dockerfile.prod
          - name: agent-service
            dockerfile: apps/agent-service/Dockerfile.prod
          - name: web
            dockerfile: apps/web/Dockerfile.prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          cache: true

      - name: Build Docker image
        run: docker build -f ${{ matrix.service.dockerfile }} -t joblensai/${{ matrix.service.name }}:scan .

      - name: Run Trivy container scan
        run: trivy image --severity CRITICAL,HIGH --format sarif --output trivy-${{ matrix.service.name }}.sarif joblensai/${{ matrix.service.name }}:scan

      - name: Upload container scan results
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles(format('trivy-{0}.sarif', matrix.service.name)) != ''
        with:
          sarif_file: "trivy-${{ matrix.service.name }}.sarif"
          category: "container-${{ matrix.service.name }}"
