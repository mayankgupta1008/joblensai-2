name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/joblensai

permissions:
  contents: read
  packages: write

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build shared package
        run: pnpm --filter @joblensai/shared build

      - name: Build all services
        run: |
          pnpm --filter auth build
          pnpm --filter backend build
          pnpm --filter payment build
          pnpm --filter notification build
          pnpm --filter agent-service build
          pnpm --filter web build

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint-and-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run --passWithNoTests

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/nodejs \
            --config p/typescript \
            --config p/jwt \
            --config p/secrets \
            apps/ packages/

  sca:
    name: SCA (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          cache: true

      - name: Run Trivy vulnerability scanner
        run: trivy fs --severity CRITICAL,HIGH .

  container-scan:
    name: Container Scan
    runs-on: ubuntu-latest
    needs: [lint-and-build]

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth
            dockerfile: apps/auth/Dockerfile.prod
          - name: backend
            dockerfile: apps/backend/Dockerfile.prod
          - name: payment
            dockerfile: apps/payment/Dockerfile.prod
          - name: notification
            dockerfile: apps/notification/Dockerfile.prod
          - name: agent-service
            dockerfile: apps/agent-service/Dockerfile.prod
          - name: web
            dockerfile: apps/web/Dockerfile.prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          cache: true

      - name: Build Docker image
        run: docker build -f ${{ matrix.service.dockerfile }} -t joblensai/${{ matrix.service.name }}:scan .

      - name: Run Trivy container scan
        run: trivy image --severity CRITICAL,HIGH joblensai/${{ matrix.service.name }}:scan

  push-images:
    name: Push Images to GHCR
    runs-on: ubuntu-latest
    needs: [test, container-scan, sast, sca]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth
            dockerfile: apps/auth/Dockerfile.prod
          - name: backend
            dockerfile: apps/backend/Dockerfile.prod
          - name: payment
            dockerfile: apps/payment/Dockerfile.prod
          - name: notification
            dockerfile: apps/notification/Dockerfile.prod
          - name: agent-service
            dockerfile: apps/agent-service/Dockerfile.prod
          - name: web
            dockerfile: apps/web/Dockerfile.prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-images:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: [push-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service: [auth, backend, payment, notification, agent-service, web]

    steps:
      - name: Delete old image versions
        uses: snok/container-retention-policy@v3
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: joblensai-${{ matrix.service }}
          cut-off: 1 second ago
          keep-n-most-recent: 1
          skip-shas: ${{ github.sha }}
