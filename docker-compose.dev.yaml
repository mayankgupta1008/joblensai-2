services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - app_network

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - app_network
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin?authSource=admin" --eval ''db.runCommand({ping:1})''',
        ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

  minio:
    image: "quay.io/minio/minio:latest"
    container_name: minio
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - NODE_ENV=development
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1:9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - BETTER_AUTH_URL=http://localhost:5173/api/auth
      - FRONTEND_URL=http://localhost:5173
    env_file:
      - ./apps/backend/.env
      - ./packages/shared/.env
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
      - ./packages:/app/packages
      - /app/packages/shared/node_modules
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5001/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile.dev
    container_name: agent-service
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    env_file:
      - ./apps/agent-service/.env
      - ./packages/shared/.env
    volumes:
      - ./apps/agent-service:/app/apps/agent-service
      - /app/apps/agent-service/node_modules
      - ./packages:/app/packages
      - /app/packages/shared/node_modules
    ports:
      - "5002:5002"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5002/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # web:
  #   build:
  #     context: .
  #     dockerfile: apps/web/Dockerfile.dev
  #   container_name: web
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=development
  #   env_file:
  #     - ./packages/shared/.env
  #   volumes:
  #     - ./apps/web:/app/apps/web
  #     - /app/apps/web/node_modules
  #     - ./packages:/app/packages
  #     - /app/packages/shared/node_modules
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #     agent-service:
  #       condition: service_healthy
  #   networks:
  #     - app_network

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile.dev
    container_name: auth
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    env_file:
      - ./apps/auth/.env
      - ./packages/shared/.env
    volumes:
      - ./apps/auth:/app/apps/auth
      - /app/apps/auth/node_modules
      - ./packages:/app/packages
      - /app/packages/shared/node_modules
    ports:
      - "5003:5003"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5003/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  minio_data:
    driver: local

networks:
  app_network:
    driver: bridge
