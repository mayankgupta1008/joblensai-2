services:
  prometheus:
    image: busybox
    container_name: prometheus
    command: sh -c "while true; do sleep 3600; done"
    networks:
      - app_network

  grafana:
    image: busybox
    container_name: grafana
    command: sh -c "while true; do sleep 3600; done"
    networks:
      - app_network

  kafka:
    image: confluentinc/cp-kafka:latest
    hostname: kafka
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kafka_data:/var/lib/kafka/data # Store Kafka logs on your local machine.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  kafka-ui:
    image: kafbat/kafka-ui
    hostname: kafka-ui
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - app_network
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    networks:
      - app_network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - app_network
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet "mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin?authSource=admin" --eval ''db.runCommand({ping:1})''',
        ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network

  minio:
    image: "quay.io/minio/minio:latest"
    container_name: minio
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - NODE_ENV=development
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  minio-init:
    image: "quay.io/minio/mc:latest"
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 root1234 root1234;
      mc mb myminio/joblensai --ignore-existing;
      mc anonymous set none myminio/joblensai;
      echo 'Bucket created successfully';
      "
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    env_file:
      - ./apps/backend/.env
      - ./packages/shared/.env
    volumes:
      - ./apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules
      - ./packages:/app/packages
      - /app/packages/shared/node_modules
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5001/api/backend/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  payment-service:
    build:
      context: .
      dockerfile: apps/payment/Dockerfile.dev
    container_name: payment-service
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    env_file:
      - ./apps/payment/.env
      - ./packages/shared/.env
    volumes:
      - ./apps/payment:/app/apps/payment
      - /app/apps/payment/node_modules
      - ./packages:/app/packages
      - /app/packages/shared/node_modules
    ports:
      - "5004:5004"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5004/api/payment/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile.dev
    container_name: agent-service
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    env_file:
      - ./apps/agent-service/.env
      - ./packages/shared/.env
    volumes:
      - ./apps/agent-service:/app/apps/agent-service
      - /app/apps/agent-service/node_modules
      - ./packages:/app/packages
      - /app/packages/shared/node_modules
    ports:
      - "5002:5002"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5002/api/agent-service/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: web
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    env_file:
      - ./packages/shared/.env
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - ./packages:/app/packages
      - /app/packages/shared/node_modules
    ports:
      - "5173:5173"
    depends_on:
      payment-service:
        condition: service_healthy
      auth:
        condition: service_healthy
      backend:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    networks:
      - app_network

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile.dev
    container_name: auth
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    env_file:
      - ./apps/auth/.env
      - ./packages/shared/.env
    volumes:
      - ./apps/auth:/app/apps/auth
      - /app/apps/auth/node_modules
      - ./packages:/app/packages
      - /app/packages/shared/node_modules
    ports:
      - "5003:5003"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5003/api/auth/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  notification-service:
    build:
      context: .
      dockerfile: apps/notification/Dockerfile.dev
    container_name: notification-service
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    env_file:
      - ./apps/notification/.env
      - ./packages/shared/.env
    volumes:
      - ./apps/notification:/app/apps/notification
      - /app/apps/notification/node_modules
      - ./packages:/app/packages
      - /app/packages/shared/node_modules
    ports:
      - "5005:5005"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5005/api/notification/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - auth
      - backend
      - agent-service
      - payment-service
    networks:
      - app_network

volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local
  minio_data:
    driver: local
  kafka_data:
    driver: local

networks:
  app_network:
    driver: bridge
